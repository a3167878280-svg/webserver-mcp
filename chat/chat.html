<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinyMCP Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex}
.sidebar{width:280px;background:#16213e;padding:16px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #0f3460}
.sidebar h2{color:#e94560;font-size:18px;margin-bottom:8px}
.sidebar label{font-size:13px;color:#a0a0b0;margin-top:4px}
.sidebar input,.sidebar select{width:100%;padding:8px 10px;background:#0f3460;border:1px solid #1a1a4e;border-radius:6px;color:#e0e0e0;font-size:13px}
.sidebar input:focus,.sidebar select:focus{outline:none;border-color:#e94560}
.sidebar .btn{width:100%;padding:10px;background:#e94560;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;margin-top:auto}
.sidebar .btn:hover{background:#d63850}
.main{flex:1;display:flex;flex-direction:column}
.header{background:#16213e;padding:12px 20px;font-size:16px;font-weight:600;border-bottom:1px solid #0f3460}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#e94560;color:#fff}
.msg.assistant{align-self:flex-start;background:#0f3460;color:#e0e0e0}
.msg.tool{align-self:flex-start;background:#1a3a1a;color:#8fbc8f;font-size:12px;border:1px solid #2a5a2a;padding:8px 12px}
.msg.error{align-self:center;background:#3a1a1a;color:#e94560;font-size:12px}
.input-area{display:flex;gap:8px;padding:12px 16px;background:#16213e;border-top:1px solid #0f3460}
.input-area textarea{flex:1;padding:10px 14px;background:#0f3460;border:1px solid #1a1a4e;border-radius:8px;color:#e0e0e0;font-size:14px;resize:none;min-height:44px;max-height:120px;font-family:inherit}
.input-area textarea:focus{outline:none;border-color:#e94560}
.input-area button{padding:10px 20px;background:#e94560;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.input-area button:disabled{opacity:.5;cursor:not-allowed}
.streaming{cursor:pointer;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>

<div class="sidebar">
  <h2>TinyMCP Chat</h2>
  <label>API Key</label>
  <input type="password" id="apiKey" placeholder="sk-... or ollama (empty)">
  <label>Base URL</label>
  <input type="text" id="baseUrl" value="https://api.openai.com/v1" placeholder="https://api.openai.com/v1">
  <label>Model</label>
  <input type="text" id="model" value="gpt-4o" list="modelList" placeholder="Type or select model...">
  <datalist id="modelList">
    <option value="gpt-4o">GPT-4o (OpenAI)</option>
    <option value="gpt-4o-mini">GPT-4o Mini (OpenAI)</option>
    <option value="gpt-4.1">GPT-4.1 (OpenAI)</option>
    <option value="claude-opus-4-7">Claude Opus 4.7 (Anthropic)</option>
    <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (Anthropic)</option>
    <option value="claude-haiku-4-5">Claude Haiku 4.5 (Anthropic)</option>
    <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet (Anthropic)</option>
    <option value="claude-3-opus-20240229">Claude 3 Opus (Anthropic)</option>
    <option value="deepseek-v3">DeepSeek V3</option>
    <option value="deepseek-r1">DeepSeek R1</option>
    <option value="qwen2.5:7b">Qwen 2.5 7B (Ollama)</option>
    <option value="qwen2.5:14b">Qwen 2.5 14B (Ollama)</option>
    <option value="llama3:8b">Llama 3 8B (Ollama)</option>
    <option value="llama3:70b">Llama 3 70B (Ollama)</option>
  </datalist>
  <label>History Rounds</label>
  <select id="historyRounds">
    <option value="5">5 rounds</option>
    <option value="10" selected>10 rounds</option>
    <option value="20">20 rounds</option>
  </select>
  <button class="btn" onclick="clearChat()">Clear Chat</button>
</div>

<div class="main">
  <div class="header">Chat</div>
  <div class="messages" id="messages">
    <div class="msg assistant">Hello! I'm your AI assistant. I can use tools like file_read and file_list to help you. Try asking me to read a file!</div>
  </div>
  <div class="input-area">
    <textarea id="input" placeholder="Type a message..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
</div>

<script>
// Load settings from localStorage
['apiKey','baseUrl','model','historyRounds'].forEach(k=>{
  const v=localStorage.getItem('chat_'+k);
  if(v) document.getElementById(k).value=v;
});

// Save settings on change
['apiKey','baseUrl','historyRounds'].forEach(k=>{
  document.getElementById(k).addEventListener('change',function(){
    localStorage.setItem('chat_'+k,this.value);
  });
});
// model uses input event (free-text, not select)
document.getElementById('model').addEventListener('input',function(){
  localStorage.setItem('chat_model',this.value);
});

let isStreaming = false;
let conversationHistory = [];

function addMessage(role, text, id) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (id) div.id = id;
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  return div;
}

function clearChat() {
  document.getElementById('messages').innerHTML = '';
  conversationHistory = [];
  addMessage('assistant', 'Chat cleared. How can I help?');
}

async function send() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg || isStreaming) return;

  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    addMessage('error', 'Please set your API Key in the sidebar');
    return;
  }

  input.value = '';
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', msg);
  const assistantDiv = addMessage('assistant', '', 'streamingMsg');
  assistantDiv.classList.add('streaming');

  const model = document.getElementById('model').value;
  const baseUrl = document.getElementById('baseUrl').value.trim();
  const maxHistory = parseInt(document.getElementById('historyRounds').value) * 2;

  // Trim history
  const history = conversationHistory.slice(-maxHistory);

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        message: msg,
        api_key: apiKey,
        model: model,
        base_url: baseUrl,
        history: history
      })
    });

    if (!resp.ok) {
      assistantDiv.classList.remove('streaming');
      assistantDiv.textContent = 'Error: ' + resp.status + ' ' + resp.statusText;
      addMessage('error', 'HTTP ' + resp.status);
      isStreaming = false;
      document.getElementById('sendBtn').disabled = false;
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      let eventType = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) {
          eventType = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          const data = line.slice(6);
          handleSSE(eventType, data, assistantDiv);
          eventType = '';
        }
      }
    }

    assistantDiv.classList.remove('streaming');
    if (fullText) {
      conversationHistory.push({role: 'user', content: msg});
      conversationHistory.push({role: 'assistant', content: fullText});
    }
  } catch (e) {
    assistantDiv.classList.remove('streaming');
    assistantDiv.textContent = 'Connection error: ' + e.message;
    addMessage('error', e.message);
  }

  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
}

function handleSSE(event, data, assistantDiv) {
  switch (event) {
    case 'delta':
      assistantDiv.textContent += data;
      break;
    case 'tool_start':
      try {
        const t = JSON.parse(data);
        addMessage('tool', '[TOOL] Calling: ' + t.tool);
      } catch(e) {}
      break;
    case 'tool_result':
      try {
        const r = JSON.parse(data);
        if (r.content && r.content[0]) {
          addMessage('tool', '[RESULT] ' + r.content[0].text.substring(0, 200));
        }
      } catch(e) {}
      break;
    case 'done':
      // final text is accumulated from deltas
      break;
    case 'error':
      addMessage('error', data);
      break;
  }
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}
</script>
</body>
</html>
