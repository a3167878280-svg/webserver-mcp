<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinyMCP Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex}
.sidebar{width:280px;background:#16213e;padding:16px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #0f3460}
.sidebar h2{color:#e94560;font-size:18px;margin-bottom:8px}
.sidebar label{font-size:13px;color:#a0a0b0;margin-top:4px}
.sidebar input,.sidebar select{width:100%;padding:8px 10px;background:#0f3460;border:1px solid #1a1a4e;border-radius:6px;color:#e0e0e0;font-size:13px}
.sidebar input:focus,.sidebar select:focus{outline:none;border-color:#e94560}
.sidebar .btn{width:100%;padding:10px;background:#e94560;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;margin-top:auto}
.sidebar .btn:hover{background:#d63850}
.main{flex:1;display:flex;flex-direction:column}
.header{background:#16213e;padding:12px 20px;font-size:16px;font-weight:600;border-bottom:1px solid #0f3460}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#e94560;color:#fff}
.msg.assistant{align-self:flex-start;background:#0f3460;color:#e0e0e0}
.msg.tool{align-self:flex-start;background:#1a3a1a;color:#8fbc8f;font-size:12px;border:1px solid #2a5a2a;padding:8px 12px}
.msg.error{align-self:center;background:#3a1a1a;color:#e94560;font-size:12px}
.input-area{display:flex;gap:8px;padding:12px 16px;background:#16213e;border-top:1px solid #0f3460}
.input-area textarea{flex:1;padding:10px 14px;background:#0f3460;border:1px solid #1a1a4e;border-radius:8px;color:#e0e0e0;font-size:14px;resize:none;min-height:44px;max-height:120px;font-family:inherit}
.input-area textarea:focus{outline:none;border-color:#e94560}
.input-area button{padding:10px 20px;background:#e94560;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.input-area button:disabled{opacity:.5;cursor:not-allowed}
.streaming{cursor:pointer;animation:pulse 1.5s infinite}
.plugin-item{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer}
.plugin-item input{margin:0;accent-color:#e94560}
.plugin-item.disabled{opacity:.4;text-decoration:line-through}
.conv-item{display:flex;align-items:center;padding:6px 8px;margin:2px 0;border-radius:4px;cursor:pointer;color:#aaa;background:#0a1628;font-size:12px;gap:4px}
.conv-item:hover{background:#16213e}
.conv-item.active{background:#e94560;color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
/* History modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#16213e;border:1px solid #0f3460;border-radius:12px;width:600px;max-height:80vh;display:flex;flex-direction:column}
.modal .modal-header{padding:16px 20px;border-bottom:1px solid #0f3460;display:flex;justify-content:space-between;align-items:center}
.modal .modal-header h3{color:#e94560;font-size:16px}
.modal .modal-header button{background:none;border:none;color:#a0a0b0;font-size:20px;cursor:pointer}
.modal .modal-body{flex:1;overflow-y:auto;padding:12px}
.history-item{display:flex;align-items:center;padding:10px 12px;margin:4px 0;background:#0a1628;border-radius:6px;gap:10px}
.history-item:hover{background:#1a2a4e}
.history-item .info{flex:1;min-width:0}
.history-item .title{font-size:14px;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item .meta{font-size:11px;color:#888;margin-top:2px}
.history-item button{padding:4px 10px;border:none;border-radius:4px;cursor:pointer;font-size:11px}
.history-item .btn-load{background:#0f3460;color:#e0e0e0}
.history-item .btn-load:hover{background:#1a4a80}
.history-item .btn-dl{background:#1a3a1a;color:#8fbc8f}
.history-item .btn-dl:hover{background:#2a5a2a}
.history-item .btn-del{background:#3a1a1a;color:#e94560}
.history-item .btn-del:hover{background:#5a2a2a}
</style>
</head>
<body>

<div class="sidebar">
  <h2>TinyMCP Chat</h2>
  <div style="display:flex;gap:4px;margin-bottom:8px">
    <button onclick="newConversation()" style="flex:1;padding:6px;background:#e94560;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px">+ New</button>
    <button onclick="showHistory()" style="flex:1;padding:6px;background:#0f3460;color:#e0e0e0;border:1px solid #1a1a4e;border-radius:4px;cursor:pointer;font-size:12px" id="historyBtn">📋 History</button>
  </div>
  <div id="convList" style="max-height:180px;overflow-y:auto;margin-bottom:8px;font-size:12px"></div>
  <label>API Key</label>
  <input type="password" id="apiKey" placeholder="local" value="local">
  <label>Base URL</label>
  <input type="text" id="baseUrl" value="http://localhost:8080/v1" placeholder="http://localhost:8080/v1">
  <label>Model</label>
  <input type="text" id="model" value="qwen2.5-1.5b" placeholder="qwen2.5-1.5b">
  <label>History Rounds</label>
  <select id="historyRounds">
    <option value="5">5 rounds</option>
    <option value="10" selected>10 rounds</option>
    <option value="20">20 rounds</option>
  </select>
  <label>Plugins <span id="pluginCount" style="color:#888;font-size:11px"></span></label>
  <div id="pluginList" style="max-height:200px;overflow-y:auto;font-size:12px;color:#aaa"></div>
  <button class="btn" onclick="clearChat()">Clear Chat</button>
</div>

<div class="main">
  <div class="header">Chat</div>
  <div class="messages" id="messages">
    <div class="msg assistant">Hello! I'm your AI assistant with 12 tools. Try: "check if mcp_server is running" or "search for TODO in src/" or "what's the weather in Beijing"</div>
  </div>
  <div class="input-area">
    <textarea id="input" placeholder="Type a message..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
</div>

<!-- History Modal -->
<div class="modal-overlay" id="historyModal" onclick="if(event.target===this)closeHistory()">
  <div class="modal">
    <div class="modal-header">
      <h3>📋 Conversation History</h3>
      <button onclick="closeHistory()">&times;</button>
    </div>
    <div class="modal-body" id="historyBody">
      <div style="text-align:center;color:#888;padding:20px">Loading...</div>
    </div>
  </div>
</div>

<script>
['apiKey','baseUrl','historyRounds'].forEach(k=>{
  const v=localStorage.getItem('chat_'+k);
  if(v) document.getElementById(k).value=v;
});
['apiKey','baseUrl','historyRounds'].forEach(k=>{
  document.getElementById(k).addEventListener('change',function(){
    localStorage.setItem('chat_'+k,this.value);
  });
});
let isStreaming = false;
let conversationHistory = [];
let availableTools = [];
let activeConvId = localStorage.getItem('chat_active_conv') || '';

// ── Conversations ──
async function loadConversations() {
  try {
    const resp = await fetch('/api/conversations');
    const list = await resp.json();
    renderConvList(list);
  } catch(e) { setTimeout(loadConversations, 2000); }
}
function renderConvList(list) {
  const c = document.getElementById('convList');
  if (!list.length) { c.innerHTML = '<div style="color:#666;font-size:11px;padding:4px">No conversations yet</div>'; return; }
  c.innerHTML = list.slice(0,10).map(conv =>
    '<div class="conv-item' + (conv.id === activeConvId ? ' active' : '') + '" ' +
    'onclick="loadConversation(\'' + conv.id + '\')" title="' + conv.created_at + '">' +
    '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">' +
    (conv.title || 'Untitled') + '</span>' +
    '<span style="color:#666;font-size:10px">' + (conv.created_at || '') + '</span>' +
    '</div>'
  ).join('');
}
async function newConversation() {
  const resp = await fetch('/api/conversations', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title: 'Chat ' + new Date().toLocaleTimeString()})
  });
  const conv = await resp.json();
  activeConvId = conv.id;
  localStorage.setItem('chat_active_conv', activeConvId);
  conversationHistory = [];
  document.getElementById('messages').innerHTML = '';
  addMessage('assistant', 'New conversation started!');
  loadConversations();
}
async function loadConversation(id) {
  activeConvId = id;
  localStorage.setItem('chat_active_conv', activeConvId);
  document.getElementById('messages').innerHTML = '<div class="msg assistant">Loading conversation...</div>';
  try {
    const resp = await fetch('/api/conversations/' + id + '/messages');
    const messages = await resp.json();
    document.getElementById('messages').innerHTML = '';
    if (!messages.length) {
      addMessage('assistant', 'Empty conversation');
    } else {
      for (const m of messages) {
        addMessage(m.role, m.content);
      }
      addMessage('tool', '--- Loaded ' + messages.length + ' messages ---');
    }
    // Rebuild conversationHistory for LLM context
    conversationHistory = messages.filter(m => m.role === 'user' || m.role === 'assistant');
  } catch(e) {
    document.getElementById('messages').innerHTML = '';
    addMessage('error', 'Failed to load: ' + e.message);
  }
  loadConversations();
}
async function deleteConversation(id) {
  if (!confirm('Delete this conversation?')) return;
  await fetch('/api/conversations?id=' + id, {method: 'DELETE'});
  if (activeConvId === id) {
    activeConvId = '';
    localStorage.removeItem('chat_active_conv');
    conversationHistory = [];
  }
  loadConversations();
  // Refresh modal if open
  if (document.getElementById('historyModal').classList.contains('show')) showHistory();
}
function downloadConversation(id) {
  window.open('/api/conversations/' + id + '/export', '_blank');
}

// ── History Modal ──
async function showHistory() {
  document.getElementById('historyModal').classList.add('show');
  document.getElementById('historyBody').innerHTML = '<div style="text-align:center;color:#888;padding:20px">Loading...</div>';
  try {
    const resp = await fetch('/api/conversations');
    const list = await resp.json();
    if (!list.length) {
      document.getElementById('historyBody').innerHTML = '<div style="text-align:center;color:#888;padding:20px">No conversations yet. Start chatting!</div>';
      return;
    }
    // Fetch message counts
    const items = await Promise.all(list.map(async c => {
      try {
        const r = await fetch('/api/conversations/' + c.id + '/messages');
        const msgs = await r.json();
        return {...c, msgCount: msgs.length};
      } catch(e) { return {...c, msgCount: 0}; }
    }));
    document.getElementById('historyBody').innerHTML = items.map(c =>
      '<div class="history-item">' +
        '<div class="info">' +
          '<div class="title">' + (c.title || 'Untitled') + '</div>' +
          '<div class="meta">' + (c.created_at || '') + ' · ' + c.msgCount + ' messages</div>' +
        '</div>' +
        '<button class="btn-load" onclick="loadConversation(\'' + c.id + '\');closeHistory()">Load</button>' +
        '<button class="btn-dl" onclick="downloadConversation(\'' + c.id + '\')">⬇ Download</button>' +
        '<button class="btn-del" onclick="deleteConversation(\'' + c.id + '\')">✕</button>' +
      '</div>'
    ).join('');
  } catch(e) {
    document.getElementById('historyBody').innerHTML = '<div style="color:#e94560;padding:20px">Error: ' + e.message + '</div>';
  }
}
function closeHistory() {
  document.getElementById('historyModal').classList.remove('show');
}

// ── Plugins ──
async function loadPlugins() {
  try {
    const resp = await fetch('/api/tools');
    const data = await resp.json();
    availableTools = data.tools || [];
    renderPlugins();
  } catch(e) { setTimeout(loadPlugins, 2000); }
}
function renderPlugins() {
  const container = document.getElementById('pluginList');
  document.getElementById('pluginCount').textContent = '(' + availableTools.length + ')';
  const disabled = JSON.parse(localStorage.getItem('chat_disabled_tools') || '[]');
  container.innerHTML = availableTools.map(t => {
    const isOff = disabled.includes(t.name);
    return '<label class="plugin-item' + (isOff ? ' disabled' : '') + '" title="' + t.description + '">' +
           '<input type="checkbox" ' + (isOff ? '' : 'checked') +
           ' onchange="togglePlugin(\'' + t.name + '\', this.checked)">' +
           t.name + '</label>';
  }).join('');
}
function togglePlugin(name, enabled) {
  let disabled = JSON.parse(localStorage.getItem('chat_disabled_tools') || '[]');
  if (enabled) disabled = disabled.filter(d => d !== name);
  else if (!disabled.includes(name)) disabled.push(name);
  localStorage.setItem('chat_disabled_tools', JSON.stringify(disabled));
  renderPlugins();
}

// ── Chat ──
function addMessage(role, text, id) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (id) div.id = id;
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  return div;
}
function clearChat() {
  document.getElementById('messages').innerHTML = '';
  conversationHistory = [];
  activeConvId = '';
  localStorage.removeItem('chat_active_conv');
  addMessage('assistant', 'Chat cleared.');
  loadConversations();
}
async function send() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg || isStreaming) return;
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { addMessage('error', 'Please set API Key'); return; }
  input.value = '';
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;
  addMessage('user', msg);
  const assistantDiv = addMessage('assistant', '', 'streamingMsg');
  assistantDiv.classList.add('streaming');
  const model = document.getElementById('model').value || 'gpt-4o';
  const baseUrl = document.getElementById('baseUrl').value.trim();
  const maxHistory = parseInt(document.getElementById('historyRounds').value) * 2;
  if (!activeConvId) {
    const r = await fetch('/api/conversations', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({title: msg.substring(0, 30)})
    });
    const c = await r.json();
    activeConvId = c.id;
    localStorage.setItem('chat_active_conv', activeConvId);
    loadConversations();
  }
  const history = conversationHistory.slice(-maxHistory);
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        message: msg, api_key: apiKey, model: model, base_url: baseUrl,
        conversation_id: activeConvId, history: history,
        disabled_tools: JSON.parse(localStorage.getItem('chat_disabled_tools') || '[]')
      })
    });
    if (!resp.ok) {
      assistantDiv.classList.remove('streaming');
      assistantDiv.textContent = 'Error: ' + resp.status;
      isStreaming = false; document.getElementById('sendBtn').disabled = false;
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      let eventType = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) eventType = line.slice(7).trim();
        else if (line.startsWith('data: ')) {
          handleSSE(eventType, line.slice(6), assistantDiv);
          eventType = '';
        }
      }
    }
    assistantDiv.classList.remove('streaming');
    if (assistantDiv.textContent) {
      conversationHistory.push({role: 'user', content: msg});
      conversationHistory.push({role: 'assistant', content: assistantDiv.textContent});
    }
  } catch(e) {
    assistantDiv.classList.remove('streaming');
    assistantDiv.textContent = 'Error: ' + e.message;
  }
  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
}
function handleSSE(event, data, assistantDiv) {
  switch(event) {
    case 'delta': assistantDiv.textContent += data; break;
    case 'tool_start':
      try { addMessage('tool', '[🔧] ' + JSON.parse(data).tool); } catch(e) {}
      break;
    case 'tool_result':
      try {
        const r = JSON.parse(data);
        if (r.content && r.content[0]) addMessage('tool', '[✓] ' + r.content[0].text.substring(0, 300));
      } catch(e) {}
      break;
    case 'done': break;
    case 'error': addMessage('error', data); break;
  }
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

// Init
loadConversations();
loadPlugins();
</script>
</body>
</html>
