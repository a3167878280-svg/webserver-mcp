<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinyMCP Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex}
.sidebar{width:280px;background:#16213e;padding:16px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #0f3460}
.sidebar h2{color:#e94560;font-size:18px;margin-bottom:8px}
.sidebar label{font-size:13px;color:#a0a0b0;margin-top:4px}
.sidebar input,.sidebar select{width:100%;padding:8px 10px;background:#0f3460;border:1px solid #1a1a4e;border-radius:6px;color:#e0e0e0;font-size:13px}
.sidebar input:focus,.sidebar select:focus{outline:none;border-color:#e94560}
.sidebar select option{background:#16213e;color:#e0e0e0}
.sidebar .btn{width:100%;padding:10px;background:#e94560;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;margin-top:auto}
.sidebar .btn:hover{background:#d63850}
.main{flex:1;display:flex;flex-direction:column}
.header{background:#16213e;padding:12px 20px;font-size:16px;font-weight:600;border-bottom:1px solid #0f3460}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#e94560;color:#fff}
.msg.assistant{align-self:flex-start;background:#0f3460;color:#e0e0e0}
.msg.tool{align-self:flex-start;background:#1a3a1a;color:#8fbc8f;font-size:12px;border:1px solid #2a5a2a;padding:8px 12px}
.msg.error{align-self:center;background:#3a1a1a;color:#e94560;font-size:12px}
/* ── 可折叠工具消息 ── */
.msg.tool{cursor:pointer;position:relative;padding:8px 12px;user-select:none}
.msg.tool .tool-header{display:flex;align-items:center;gap:6px}
.msg.tool .tool-spinner{display:inline-block;width:12px;height:12px;border:2px solid #8fbc8f;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0}
.msg.tool .tool-icon{font-size:14px;flex-shrink:0}
.msg.tool .tool-summary{color:#8fbc8f;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.msg.tool .tool-toggle{font-size:10px;color:#5a8a5a;flex-shrink:0;transition:transform 0.2s}
.msg.tool.expanded .tool-toggle{transform:rotate(90deg)}
.msg.tool .tool-detail{display:none;margin-top:6px;padding:8px;background:#0a1a0a;border-radius:4px;font-size:11px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;cursor:text;user-select:text}
.msg.tool.expanded .tool-detail{display:block}
.msg.tool.completed .tool-spinner{display:none}
.msg.tool.completed .tool-summary{color:#4a4}
.msg.tool.error-tool{background:#3a1a1a;border-color:#5a2a2a}
.msg.tool.error-tool .tool-summary{color:#e94560}
@keyframes spin{to{transform:rotate(360deg)}}
.input-area{display:flex;gap:8px;padding:12px 16px;background:#16213e;border-top:1px solid #0f3460}
.input-area textarea{flex:1;padding:10px 14px;background:#0f3460;border:1px solid #1a1a4e;border-radius:8px;color:#e0e0e0;font-size:14px;resize:none;min-height:44px;max-height:120px;font-family:inherit}
.input-area textarea:focus{outline:none;border-color:#e94560}
.input-area button{padding:10px 20px;background:#e94560;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.input-area button:disabled{opacity:.5;cursor:not-allowed}
.streaming{cursor:pointer;animation:pulse 1.5s infinite}
.plugin-item{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer}
.plugin-item input{margin:0;accent-color:#e94560}
.plugin-item.disabled{opacity:.4;text-decoration:line-through}
.conv-item{display:flex;align-items:center;padding:6px 8px;margin:2px 0;border-radius:4px;cursor:pointer;color:#aaa;background:#0a1628;font-size:12px;gap:4px}
.conv-item:hover{background:#16213e}
.conv-item.active{background:#e94560;color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
/* History modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#16213e;border:1px solid #0f3460;border-radius:12px;width:600px;max-height:80vh;display:flex;flex-direction:column}
.modal .modal-header{padding:16px 20px;border-bottom:1px solid #0f3460;display:flex;justify-content:space-between;align-items:center}
.modal .modal-header h3{color:#e94560;font-size:16px}
.modal .modal-header button{background:none;border:none;color:#a0a0b0;font-size:20px;cursor:pointer}
.modal .modal-body{flex:1;overflow-y:auto;padding:12px}
.history-item{display:flex;align-items:center;padding:10px 12px;margin:4px 0;background:#0a1628;border-radius:6px;gap:10px}
.history-item:hover{background:#1a2a4e}
.history-item .info{flex:1;min-width:0}
.history-item .title{font-size:14px;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item .meta{font-size:11px;color:#888;margin-top:2px}
.history-item button{padding:4px 10px;border:none;border-radius:4px;cursor:pointer;font-size:11px}
.history-item .btn-load{background:#0f3460;color:#e0e0e0}
.history-item .btn-load:hover{background:#1a4a80}
.history-item .btn-dl{background:#1a3a1a;color:#8fbc8f}
.history-item .btn-dl:hover{background:#2a5a2a}
.history-item .btn-del{background:#3a1a1a;color:#e94560}
.history-item .btn-del:hover{background:#5a2a2a}
</style>
</head>
<body>

<div class="sidebar">
  <h2>TinyMCP Chat</h2>
  <div style="display:flex;gap:4px;margin-bottom:8px">
    <button onclick="newConversation()" style="flex:1;padding:6px;background:#e94560;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px">+ New</button>
    <button onclick="showHistory()" style="flex:1;padding:6px;background:#0f3460;color:#e0e0e0;border:1px solid #1a1a4e;border-radius:4px;cursor:pointer;font-size:12px" id="historyBtn">📋 History</button>
  </div>
  <div id="convList" style="max-height:180px;overflow-y:auto;margin-bottom:8px;font-size:12px"></div>
  <label>LLM Provider</label>
  <select id="provider" onchange="onProviderChange()">
    <option value="local" selected>🖥️ 本地模型 (Qwen3 4B)</option>
    <option value="custom">☁️ 自定义 API</option>
  </select>
  <div id="customFields" style="display:none">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <label>Base URL</label>
    <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1">
    <label>Model</label>
    <input type="text" id="model" placeholder="gpt-4o">
  </div>
  <div id="localInfo" style="font-size:11px;color:#888;padding:4px 0">
    Base: localhost:8080/v1 · Model: qwen3:4B
  </div>
  <div id="localModeBox">
    <label>Local Mode</label>
    <select id="localMode">
      <option value="realtime" selected>实时优先（禁用工具）</option>
      <option value="tools">工具优先（非实时）</option>
    </select>
    <div style="font-size:10px;color:#888;padding:3px 0">你的本地服务不支持 stream+tools，只能二选一。</div>
  </div>
  <label>History Rounds <span style="font-size:10px;color:#888">(backend auto-manages context)</span></label>
  <select id="historyRounds">
    <option value="5">5 rounds</option>
    <option value="10" selected>10 rounds</option>
    <option value="20">20 rounds</option>
    <option value="50">50 rounds</option>
  </select>
  <label>Plugins <span id="pluginCount" style="color:#888;font-size:11px"></span></label>
  <div id="pluginList" style="max-height:200px;overflow-y:auto;font-size:12px;color:#aaa"></div>
  <button class="btn" onclick="clearChat()">Clear Chat</button>
</div>

<div class="main">
  <div class="header" id="chatHeader">New Chat</div>
  <div class="messages" id="messages">
    <div class="msg assistant">Hello! I'm your AI assistant with 12 tools. Try: "check if mcp_server is running" or "search for TODO in src/" or "what's the weather in Beijing"</div>
  </div>
  <div class="input-area">
    <textarea id="input" placeholder="Type a message..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
</div>

<!-- History Modal -->
<div class="modal-overlay" id="historyModal" onclick="if(event.target===this)closeHistory()">
  <div class="modal">
    <div class="modal-header">
      <h3>📋 Conversation History</h3>
      <button onclick="closeHistory()">&times;</button>
    </div>
    <div class="modal-body" id="historyBody">
      <div style="text-align:center;color:#888;padding:20px">Loading...</div>
    </div>
  </div>
</div>

<script>
// ── Provider settings ──
const LOCAL_DEFAULTS = {apiKey:'local', baseUrl:'http://localhost:8080/v1', model:'qwen3:4B'};

function getProvider() { return localStorage.getItem('chat_provider') || 'local'; }
function onProviderChange() {
  const p = document.getElementById('provider').value;
  localStorage.setItem('chat_provider', p);
  document.getElementById('customFields').style.display = (p==='custom') ? 'block' : 'none';
  document.getElementById('localInfo').style.display = (p==='local') ? 'block' : 'none';
  document.getElementById('localModeBox').style.display = (p==='local') ? 'block' : 'none';
}

// Restore saved
const savedProvider = getProvider();
document.getElementById('provider').value = savedProvider;
['apiKey','baseUrl','model','historyRounds','localMode'].forEach(k=>{
  const el = document.getElementById(k);
  if (!el) return;
  const v = localStorage.getItem('chat_'+k);
  if (v) el.value = v;
});
onProviderChange();

// Auto-save custom fields
['apiKey','baseUrl','model','historyRounds','localMode'].forEach(k=>{
  const el = document.getElementById(k);
  if (!el) return;
  el.addEventListener('change',function(){
    localStorage.setItem('chat_'+k,this.value);
  });
});
document.getElementById('model')?.addEventListener('input',function(){
  localStorage.setItem('chat_model',this.value);
});

let isStreaming = false;
let conversationHistory = [];
let availableTools = [];
let activeConvId = localStorage.getItem('chat_active_conv') || '';

// ── Conversations ──
async function loadConversations() {
  try {
    const resp = await fetch('/api/conversations');
    const list = await resp.json();
    renderConvList(list);
  } catch(e) { setTimeout(loadConversations, 2000); }
}
function renderConvList(list) {
  const c = document.getElementById('convList');
  if (!list.length) { c.innerHTML = '<div style="color:#666;font-size:11px;padding:4px">No conversations yet</div>'; return; }
  c.innerHTML = list.slice(0,10).map(conv =>
    '<div class="conv-item' + (conv.id === activeConvId ? ' active' : '') + '" ' +
    'onclick="loadConversation(\'' + conv.id + '\')" title="' + conv.created_at + '">' +
    '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">' +
    (conv.title || 'Untitled') + '</span>' +
    '<span style="color:#666;font-size:10px">' + (conv.created_at || '') + '</span>' +
    '</div>'
  ).join('');
}
async function createConversation(title) {
  const resp = await fetch('/api/conversations', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title})
  });
  if (!resp.ok) throw new Error('创建对话失败: HTTP ' + resp.status);
  let conv;
  try {
    conv = await resp.json();
  } catch(e) {
    throw new Error('创建对话失败: 服务端返回不是 JSON');
  }
  if (!conv || !conv.id) throw new Error('创建对话失败: 服务端未返回对话 ID');
  return conv;
}
async function newConversation() {
  try {
    const conv = await createConversation('Chat ' + new Date().toLocaleTimeString());
    activeConvId = conv.id;
    localStorage.setItem('chat_active_conv', activeConvId);
    conversationHistory = [];
    document.getElementById('messages').innerHTML = '';
    document.getElementById('chatHeader').textContent = 'New Chat';
    addMessage('assistant', '新对话已创建。试试问点什么吧！');
    loadConversations();
  } catch(e) {
    addMessage('error', e.message);
  }
}
async function loadConversation(id) {
  activeConvId = id;
  localStorage.setItem('chat_active_conv', activeConvId);
  document.getElementById('messages').innerHTML = '<div class="msg assistant">Loading conversation...</div>';
  try {
    // 获取对话元信息（标题等）
    const metaResp = await fetch('/api/conversations');
    const list = await metaResp.json();
    const conv = list.find(c => c.id === id);
    const title = conv ? conv.title : 'Chat';

    // 更新头栏
    document.getElementById('chatHeader').textContent = '📋 ' + title;

    // 加载消息
    const resp = await fetch('/api/conversations/' + id + '/messages');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const messages = await resp.json();
    if (!Array.isArray(messages)) throw new Error('Invalid messages response');
    document.getElementById('messages').innerHTML = '';
    if (!messages.length) {
      addMessage('assistant', '空对话');
    } else {
      for (const m of messages) {
        addMessage(m.role, m.content);
      }
      // 视觉分隔：已加载的历史 vs 新消息
      const sep = document.createElement('div');
      sep.className = 'msg tool';
      sep.style.cssText = 'text-align:center;border-top:1px dashed #4a6a4a;border-bottom:1px dashed #4a6a4a;padding:6px;margin:4px 0;cursor:default';
      sep.textContent = '── 以上是历史记录 · 下方继续对话 ──';
      document.getElementById('messages').appendChild(sep);
    }
    // 重建 conversationHistory（服务端已管理完整历史，这里仅用于前端显示计数）
    conversationHistory = messages.filter(m => m.role === 'user' || m.role === 'assistant');
  } catch(e) {
    if (activeConvId === id) {
      activeConvId = '';
      localStorage.removeItem('chat_active_conv');
      conversationHistory = [];
      document.getElementById('chatHeader').textContent = 'New Chat';
    }
    document.getElementById('messages').innerHTML = '';
    addMessage('error', '加载失败: ' + e.message + '，已清除失效对话，请重新发送消息。');
  }
  loadConversations();
}
async function deleteConversation(id) {
  if (!confirm('Delete this conversation?')) return;
  await fetch('/api/conversations?id=' + id, {method: 'DELETE'});
  if (activeConvId === id) {
    activeConvId = '';
    localStorage.removeItem('chat_active_conv');
    conversationHistory = [];
  }
  loadConversations();
  // Refresh modal if open
  if (document.getElementById('historyModal').classList.contains('show')) showHistory();
}
function downloadConversation(id) {
  window.open('/api/conversations/' + id + '/export', '_blank');
}

// ── History Modal ──
async function showHistory() {
  document.getElementById('historyModal').classList.add('show');
  document.getElementById('historyBody').innerHTML = '<div style="text-align:center;color:#888;padding:20px">Loading...</div>';
  try {
    const resp = await fetch('/api/conversations');
    const list = await resp.json();
    if (!list.length) {
      document.getElementById('historyBody').innerHTML = '<div style="text-align:center;color:#888;padding:20px">No conversations yet. Start chatting!</div>';
      return;
    }
    // Fetch message counts
    const items = await Promise.all(list.map(async c => {
      try {
        const r = await fetch('/api/conversations/' + c.id + '/messages');
        const msgs = await r.json();
        return {...c, msgCount: msgs.length};
      } catch(e) { return {...c, msgCount: 0}; }
    }));
    document.getElementById('historyBody').innerHTML = items.map(c =>
      '<div class="history-item">' +
        '<div class="info">' +
          '<div class="title">' + (c.title || 'Untitled') + '</div>' +
          '<div class="meta">' + (c.created_at || '') + ' · ' + c.msgCount + ' messages</div>' +
        '</div>' +
        '<button class="btn-load" onclick="loadConversation(\'' + c.id + '\');closeHistory()">Load</button>' +
        '<button class="btn-dl" onclick="downloadConversation(\'' + c.id + '\')">⬇ Download</button>' +
        '<button class="btn-del" onclick="deleteConversation(\'' + c.id + '\')">✕</button>' +
      '</div>'
    ).join('');
  } catch(e) {
    document.getElementById('historyBody').innerHTML = '<div style="color:#e94560;padding:20px">Error: ' + e.message + '</div>';
  }
}
function closeHistory() {
  document.getElementById('historyModal').classList.remove('show');
}

// ── Plugins ──
async function loadPlugins() {
  try {
    const resp = await fetch('/api/tools');
    const data = await resp.json();
    availableTools = data.tools || [];
    renderPlugins();
  } catch(e) { setTimeout(loadPlugins, 2000); }
}
function renderPlugins() {
  const container = document.getElementById('pluginList');
  document.getElementById('pluginCount').textContent = '(' + availableTools.length + ')';
  const disabled = JSON.parse(localStorage.getItem('chat_disabled_tools') || '[]');
  container.innerHTML = availableTools.map(t => {
    const isOff = disabled.includes(t.name);
    return '<label class="plugin-item' + (isOff ? ' disabled' : '') + '" title="' + t.description + '">' +
           '<input type="checkbox" ' + (isOff ? '' : 'checked') +
           ' onchange="togglePlugin(\'' + t.name + '\', this.checked)">' +
           t.name + '</label>';
  }).join('');
}
function togglePlugin(name, enabled) {
  let disabled = JSON.parse(localStorage.getItem('chat_disabled_tools') || '[]');
  if (enabled) disabled = disabled.filter(d => d !== name);
  else if (!disabled.includes(name)) disabled.push(name);
  localStorage.setItem('chat_disabled_tools', JSON.stringify(disabled));
  renderPlugins();
}

// ── Chat ──
function addMessage(role, text, id) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (id) div.id = id;
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  return div;
}
async function clearChat() {
  document.getElementById('messages').innerHTML = '';
  conversationHistory = [];
  activeConvId = '';
  localStorage.removeItem('chat_active_conv');
  document.getElementById('chatHeader').textContent = 'New Chat';
  // 自动创建新对话替代清空的
  await newConversation();
}
async function send() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg || isStreaming) return;

  // 根据 provider 获取配置
  const provider = getProvider();
  let apiKey, baseUrl, model;
  if (provider === 'local') {
    apiKey = LOCAL_DEFAULTS.apiKey;
    baseUrl = LOCAL_DEFAULTS.baseUrl;
    model = LOCAL_DEFAULTS.model;
  } else {
    apiKey = document.getElementById('apiKey').value.trim();
    baseUrl = document.getElementById('baseUrl').value.trim();
    model = document.getElementById('model').value.trim() || 'gpt-4o';
  }
  if (!apiKey) { addMessage('error', 'Please set API Key'); return; }

  input.value = '';
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;
  addMessage('user', msg);
  const assistantDiv = addMessage('assistant', '', 'streamingMsg');
  assistantDiv.classList.add('streaming');
  const assistantState = {text: ''};
  thinkBuf = '';
  pendingToolDiv = null;
  // 确保有活跃对话（没有则自动创建）
  if (!activeConvId) {
    try {
      const c = await createConversation(msg.substring(0, 30) || 'New Chat');
      activeConvId = c.id;
      localStorage.setItem('chat_active_conv', activeConvId);
      document.getElementById('chatHeader').textContent = '📋 ' + (c.title || 'New Chat');
      loadConversations();
    } catch(e) {
      assistantDiv.classList.remove('streaming');
      assistantDiv.textContent = 'Error: ' + e.message;
      isStreaming = false;
      document.getElementById('sendBtn').disabled = false;
      return;
    }
  }

  // 构建请求体：有 conv_id 时服务端自动加载完整历史（含 token 感知管理）
  // 不再发送冗余的 inline history，避免双数据源混乱
  const disabledTools = JSON.parse(localStorage.getItem('chat_disabled_tools') || '[]');
  const localMode = provider === 'local' ? document.getElementById('localMode').value : '';
  const localRealtime = provider === 'local' && localMode === 'realtime';
  const reqBody = {
    message: msg, api_key: apiKey, model: model, base_url: baseUrl,
    conversation_id: activeConvId,
    local_mode: localMode,
    // 本地兼容服务不能 stream+tools；实时模式禁用工具，工具模式保留工具但会非实时。
    disabled_tools: localRealtime ? ['*'] : disabledTools
  };
  // 只在没有 conv_id 时才发送内联 history 作为兜底
  if (!activeConvId) {
    const maxHistory = parseInt(document.getElementById('historyRounds').value) * 2;
    reqBody.history = conversationHistory.slice(-maxHistory);
  }

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(reqBody)
    });
    if (!resp.ok) {
      assistantDiv.classList.remove('streaming');
      assistantDiv.textContent = 'Error: ' + resp.status;
      isStreaming = false; document.getElementById('sendBtn').disabled = false;
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      let eventType = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) eventType = line.slice(7).trim();
        else if (line.startsWith('data: ')) {
          handleSSE(eventType, line.slice(6), assistantDiv, assistantState);
          eventType = '';
        }
      }
      // 强制浏览器立即渲染，实现实时打字效果
      void assistantDiv.offsetHeight;
    }
    assistantDiv.classList.remove('streaming');
    if (assistantDiv.textContent) {
      conversationHistory.push({role: 'user', content: msg});
      conversationHistory.push({role: 'assistant', content: assistantDiv.textContent});
    }
  } catch(e) {
    assistantDiv.classList.remove('streaming');
    assistantDiv.textContent = 'Error: ' + e.message;
  }
  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
}
// 过滤 Qwen3/DeepSeek thinking 内容: <think>...</think>（支持跨 chunk，大小写不敏感）
let thinkBuf = '';
function stripThink(text) {
  const full = thinkBuf + text;
  // 大小写不敏感的完整 think 块移除
  let result = full.replace(/<think[^>]*>[\s\S]*?<\/think>/gi, '');
  // 检测尾部未闭合的 <think> — 缓存到下一 chunk
  const matches = [...result.matchAll(/<\/?think[^>]*>/gi)];
  const lastTag = matches.length ? matches[matches.length - 1] : null;
  if (lastTag && !lastTag[0].startsWith('</')) {
    thinkBuf = result.substring(lastTag.index);
    result = result.substring(0, lastTag.index);
  } else {
    thinkBuf = '';
  }
  return result;
}
// 模拟打字效果: 大段文本逐字显示 (流式兜底)
let typeTimers = {};
function simulateType(el, text) {
  // 清除之前的打字计时器
  if (typeTimers[el.id]) clearInterval(typeTimers[el.id]);
  let i = 0;
  const speed = 18;  // ms/字
  typeTimers[el.id] = setInterval(() => {
    if (i < text.length) {
      el.textContent += text[i];
      i++;
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    } else {
      clearInterval(typeTimers[el.id]);
      delete typeTimers[el.id];
    }
  }, speed);
}

let pendingToolDiv = null;  // 当前等待结果的工具卡片
function createToolDiv(toolName) {
  const div = document.createElement('div');
  div.className = 'msg tool';
  div.innerHTML =
    '<div class="tool-header">' +
      '<span class="tool-spinner"></span>' +
      '<span class="tool-icon">🔧</span>' +
      '<span class="tool-summary">' + toolName + '</span>' +
      '<span class="tool-toggle">▶</span>' +
    '</div>' +
    '<div class="tool-detail"></div>';
  div.onclick = function(e) {
    // 点击在详情区域时不折叠（方便选中文字）
    if (e.target.closest('.tool-detail')) return;
    this.classList.toggle('expanded');
  };
  document.getElementById('messages').appendChild(div);
  return div;
}
function completeToolDiv(div, summary, fullText, isError) {
  div.classList.add('completed');
  if (isError) div.classList.add('error-tool');
  div.querySelector('.tool-summary').textContent = summary;
  div.querySelector('.tool-detail').textContent = fullText || summary;
  // 如果结果较短，自动展开
  if (fullText && fullText.length < 300) div.classList.add('expanded');
}

function handleSSE(event, data, assistantDiv, assistantState) {
  switch(event) {
    case 'delta': {
      const clean = stripThink(data);
      if (!clean) break;
      assistantState.text += clean;
      assistantDiv.textContent = assistantState.text;
      break;
    }
    case 'tool_start': {
      try {
        const toolName = JSON.parse(data).tool || 'unknown';
        // 完成上一个 tool div（如果有且未完成）
        if (pendingToolDiv && !pendingToolDiv.classList.contains('completed')) {
          completeToolDiv(pendingToolDiv, '(no result)', '', false);
        }
        pendingToolDiv = createToolDiv(toolName);
      } catch(e) { /* 解析失败就忽略 */ }
      break;
    }
    case 'tool_result': {
      try {
        const r = JSON.parse(data);
        const fullText = r.content && r.content[0] ? r.content[0].text : JSON.stringify(r, null, 2);
        const summary = (r.content && r.content[0] ? r.content[0].text : '').substring(0, 200);
        const finalSummary = summary + (summary.length >= 200 ? '...' : '');
        if (pendingToolDiv) {
          completeToolDiv(pendingToolDiv, finalSummary, fullText, r.isError);
        } else {
          // fallback: 没有 tool_start 直接来了 tool_result
          const div = createToolDiv(r.content && r.content[0] ? 'Tool result' : 'Tool');
          completeToolDiv(div, finalSummary, fullText, r.isError);
        }
      } catch(e) { /* 忽略 */ }
      pendingToolDiv = null;
      break;
    }
    case 'done': {
      // done 携带服务端累积的完整回复；以它为准，避免本地模型批量返回时只显示工具卡片。
      if (data) {
        let displayText = data.replace(/<think[^>]*>[\s\S]*?<\/think>/gi, '').trim();
        if (!displayText) displayText = data.replace(/<\/?think[^>]*>/gi, '').trim();
        assistantState.text = displayText || assistantState.text;
        assistantDiv.textContent = assistantState.text;
      }
      break;
    }
    case 'error': addMessage('error', data); break;
  }
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

// Init
(async function init() {
  loadPlugins();
  if (activeConvId) {
    await loadConversation(activeConvId);
  } else {
    await newConversation();
  }
})();
</script>
